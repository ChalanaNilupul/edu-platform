services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: edu_platform
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - edu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edu_admin -d edu_platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edu_postgres_data:
